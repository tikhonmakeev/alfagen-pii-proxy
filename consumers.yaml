# Реестр систем-потребителей.
# Каждая запись описывает одну систему, которая обращается к сервису.
consumers:
  # Потребитель для нагрузочного прогона / официального чекера.
  - id: loadtest
    # ИМЯ переменной окружения, где лежит секретный ключ.
    # Сам ключ в YAML никогда не хранится — только имя переменной.
    api_key_env: LOADTEST_API_KEY
    # Включена ли система.
    enabled: true
    # Список разрешённых типов ПДн для маскирования.
    # Пустой список означает "разрешены все типы".
    allowed_types: []
    # Разрешено ли демаскирование (обратное восстановление текста).
    unmask_enabled: true

  # Демо-потребитель: маскирует только email, телефон и ФИО.
  - id: demo-consumer
    api_key_env: DEMO_API_KEY
    enabled: true
    allowed_types: ["email", "phone", "full_name"]
    unmask_enabled: true

  # Аналитика: видит только маску, оригинал ей не положен.
  - id: readonly-analytics
    api_key_env: ANALYTICS_API_KEY
    enabled: true
    # Все типы маскируются.
    allowed_types: []
    # Демаскирование запрещено — аналитика не восстанавливает оригинал.
    unmask_enabled: false